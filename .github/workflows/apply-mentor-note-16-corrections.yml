name: Apply mentor note 16 corrections

on:
  push:
    branches:
      - docs/mentor-note-16-corrections-v2

permissions:
  contents: write

concurrency:
  group: mentor-note-16-corrections-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply C01-C16 to the monolithic note
        run: python .github/scripts/apply_mentor_note_16_corrections.py

      - name: Verify patch formatting and scope
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "20_팀 프로젝트/3차 프로젝트/8.19 멘토님과 상담.md"

      - name: Remove temporary automation files
        run: |
          rm .github/scripts/apply_mentor_note_16_corrections.py
          rm .github/workflows/apply-mentor-note-16-corrections.yml

      - name: Commit corrected monolithic note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "20_팀 프로젝트/3차 프로젝트/8.19 멘토님과 상담.md" ".github/scripts/apply_mentor_note_16_corrections.py" ".github/workflows/apply-mentor-note-16-corrections.yml"
          git commit -m "docs: apply 16 mentor note corrections before split"
          git push origin HEAD:docs/mentor-note-16-corrections-v2
