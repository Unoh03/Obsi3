name: Finalize mentor note 16 corrections

on:
  pull_request:
    branches:
      - master
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalize-mentor-note-16-corrections-v2
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize consistency of C01-C16
        run: python .github/scripts/finalize_mentor_note_16_corrections.py

      - name: Verify formatting and single-note scope
        run: |
          git diff --check
          git config core.quotepath false
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "20_팀 프로젝트/3차 프로젝트/8.19 멘토님과 상담.md"

      - name: Remove temporary automation files
        run: |
          rm .github/scripts/finalize_mentor_note_16_corrections.py
          rm .github/workflows/finalize-mentor-note-16-corrections.yml

      - name: Commit final single-note corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "20_팀 프로젝트/3차 프로젝트/8.19 멘토님과 상담.md" ".github/scripts/finalize_mentor_note_16_corrections.py" ".github/workflows/finalize-mentor-note-16-corrections.yml"
          git commit -m "docs: finalize 16 mentor note corrections before split"
          git push origin HEAD:docs/mentor-note-16-corrections-v2
